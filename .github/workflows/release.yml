name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate version tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            :
          else
            echo "Unsupported release tag: $TAG" >&2
            exit 1
          fi
      - name: Run release validation
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q balloon_keeper.py web_server.py libvirt_balloon_keeper tests
          bash -n unraid/*.sh
      - name: Build release package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}" bash unraid/build-package.sh dist
          sha256sum -c dist/libvirt-balloon-keeper.tar.gz.sha256
          ACTUAL="$(sha256sum dist/libvirt-balloon-keeper.tar.gz | cut -d' ' -f1)"
          EXPECTED="$(sed -n 's/.*<!ENTITY sha256[[:space:]]*"\([0-9a-f]\{64\}\)".*/\1/p' unraid/libvirt-balloon-keeper.plg)"
          printf 'manifest checksum: %s\nbuilt checksum: %s\n' "$EXPECTED" "$ACTUAL"
          test -n "$EXPECTED" && test "$ACTUAL" = "$EXPECTED"
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            "dist/libvirt-balloon-keeper.tar.gz" \
            "dist/libvirt-balloon-keeper.tar.gz.sha256" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes
