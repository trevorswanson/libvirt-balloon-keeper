name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test tooling
        run: python -m pip install --disable-pip-version-check 'coverage>=7.4,<8'
      - name: Compile Python
        run: python3 -m compileall -q balloon_keeper.py libvirt_balloon_keeper tests
      - name: Shell syntax
        run: bash -n unraid/*.sh
      - name: Validate metadata
        run: python3 -m unittest tests.test_distribution -v
      - name: Unit tests with branch coverage
        run: |
          python3 -m coverage run --branch -m unittest discover -s tests -v
          python3 -m coverage report --fail-under=90
      - name: Validate example configuration
        run: python3 balloon_keeper.py --config config.example.toml --check-config

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build package twice
        run: |
          VERSION=0.1.0 bash unraid/build-package.sh "$RUNNER_TEMP/build-a"
          VERSION=0.1.0 bash unraid/build-package.sh "$RUNNER_TEMP/build-b"
          cmp "$RUNNER_TEMP/build-a/libvirt-balloon-keeper-0.1.0.tar.gz" \
              "$RUNNER_TEMP/build-b/libvirt-balloon-keeper-0.1.0.tar.gz"
          sha256sum -c "$RUNNER_TEMP/build-a/libvirt-balloon-keeper-0.1.0.tar.gz.sha256"
          mkdir -p dist
          cp "$RUNNER_TEMP/build-a"/* dist/
      - name: Inspect package contents
        run: |
          tar -tzf dist/libvirt-balloon-keeper-0.1.0.tar.gz
          ! tar -tzf dist/libvirt-balloon-keeper-0.1.0.tar.gz | grep -E '(__pycache__/|\.pyc$)'
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: libvirt-balloon-keeper-0.1.0
          path: dist/*
          if-no-files-found: error
